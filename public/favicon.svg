<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35" />

  <!-- Outer Tech Radar Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 14" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.15" />

  <!-- Smart Mobility / Wheelchair Icon Modern Tech Vector -->
  <g filter="url(#neonGlow)">
    <!-- User Head / AI Node -->
    <circle cx="280" cy="140" r="38" fill="url(#primaryGrad)" stroke="#e0f2fe" stroke-width="6" />
    
    <!-- Spine / Torso and Arm to Controller -->
    <path d="M 280 190 L 280 270 L 345 270 L 375 230" fill="none" stroke="url(#primaryGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="380" cy="225" r="12" fill="#38bdf8" />
    
    <!-- Seat & Leg Rest -->
    <path d="M 235 295 L 340 295 L 375 390 L 405 390" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Large Drive Wheel (Motorized) -->
    <circle cx="230" cy="340" r="85" fill="none" stroke="url(#primaryGrad)" stroke-width="28" />
    <!-- Wheel Hub & Electric Motor Accents -->
    <circle cx="230" cy="340" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="12" />
    <circle cx="230" cy="340" r="8" fill="#38bdf8" />
    
    <!-- Wheel Spokes -->
    <line x1="230" y1="265" x2="230" y2="415" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.7" />
    <line x1="155" y1="340" x2="305" y2="340" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.7" />
    
    <!-- Front Caster Wheel -->
    <circle cx="375" cy="415" r="24" fill="none" stroke="#38bdf8" stroke-width="16" />
    <circle cx="375" cy="415" r="6" fill="#e0f2fe" />
    
    <!-- Tech Signal / Energy Pulse -->
    <path d="M 130 180 A 140 140 0 0 1 190 120" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 105 195 A 175 175 0 0 1 180 100" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-dasharray="6 10" stroke-opacity="0.6" />
  </g>
</svg>
